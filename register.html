<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register | Technet Technologies</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg"/>
</head>
<body>

<nav>
  <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
    <img src="assets/favicon.jpg" alt="Technet Icon" style="width: 36px; height: 36px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);">
    <div class="logo-text">TECHNET</div>
  </a>
  <div class="nav-links">
    <a href="services.html">Services</a>
    <a href="gaming.html">Gaming Hub</a>
    <a href="trading.html">Financial Trading</a>
    <a href="genius.html">Genius AI</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <div class="nav-auth">
    <a href="login.html" class="btn-auth-text"><i class="fa-solid fa-right-to-bracket"></i> Log In</a>
    <a href="register.html" class="btn-auth-primary">Register <i class="fa-solid fa-arrow-right"></i></a>
  </div>
</nav>

<div class="page-header" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="modal-content" style="position: relative; max-width: 450px; width: 100%;">
    <div class="modal-header" style="text-align: center;">
      <img src="assets/favicon.jpg" alt="Technet" style="width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); margin-bottom: 1rem;">
      <h3 style="font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 0.5rem;">Create an Account</h3>
      <p style="color: var(--text-muted); font-size: 1rem;">Join Technet to access premium features.</p>
    </div>
    
    <div class="social-login-container" style="display: flex; gap: 10px; margin-bottom: 1.5rem; margin-top: 1.5rem;">
      <button class="social-login-btn"><i class="fa-brands fa-google"></i> Google</button>
      <button class="social-login-btn"><i class="fa-brands fa-apple"></i> Apple</button>
      <button class="social-login-btn"><i class="fa-brands fa-github"></i> GitHub</button>
    </div>
    
    <div class="auth-separator" style="display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
      <div style="flex: 1; border-bottom: 1px solid var(--border-light);"></div>
      <span style="padding: 0 10px;">or continue with email</span>
      <div style="flex: 1; border-bottom: 1px solid var(--border-light);"></div>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>Username</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-at"></i>
          <input type="text" id="regUsername" class="form-input" required placeholder="e.g. techboywayne" style="padding-left: 2.5rem;">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-with-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="regEmail" class="form-input" required placeholder="name@example.com" style="padding-left: 2.5rem;">
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword" class="form-input" required placeholder="********" style="padding-left: 2.5rem; padding-right: 2.5rem;">
          <i class="fa-regular fa-eye" id="togglePasswordIcon" onclick="togglePasswordVisibility()" style="left: auto; right: 14px; cursor: pointer; pointer-events: all;"></i>
        </div>
        <div id="authRequirements" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px dashed var(--border-light); line-height: 1.5;">
          <strong style="color:var(--text-main);"><i class="fa-solid fa-shield-halved"></i> Registration Requirements:</strong><br><span style="display:inline-block;margin-top:5px;">&bull; Use a valid active email address<br>&bull; Password must be at least 6 characters</span>
        </div>
      </div>
      <div id="regError" style="color: #ff4757; font-size: 0.9rem; margin-top: 10px; display: none;"></div>
      <button type="submit" id="regBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 14px; font-size: 1.05rem;">Register Account</button>
    </form>
    
    <div class="modal-footer" style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-light); padding-top: 1.5rem;">
      <span style="color: var(--text-muted);">Already have an account?</span> 
      <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 5px;">Log In</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="main.js"></script>

<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (typeof auth === 'undefined') {
      alert("Firebase is not initialized. Please configure firebase-config.js.");
      return;
    }
    
    const username = document.getElementById('regUsername').value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const btn = document.getElementById('regBtn');
    const errDiv = document.getElementById('regError');
    
    if (username.length < 3) {
      errDiv.textContent = "Username must be at least 3 alphanumeric characters.";
      errDiv.style.display = 'block';
      return;
    }

    btn.textContent = "Creating Account...";
    btn.disabled = true;
    errDiv.style.display = 'none';

    // Step 1: Check if username is taken in Firestore
    const userDocRef = db.collection('users').doc(username);
    
    userDocRef.get().then((doc) => {
      if (doc.exists) {
        throw new Error("Username is already taken. Please choose another.");
      }
      // Step 2: Create Auth account
      return auth.createUserWithEmailAndPassword(email, password);
    })
    .then((userCredential) => {
      // Step 3: Save to Firestore
      return userDocRef.set({
        email: email,
        uid: userCredential.user.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        // Step 4: Update Auth Profile
        return userCredential.user.updateProfile({
          displayName: username
        }).then(() => {
          // Step 5: Send Verification Email
          return userCredential.user.sendEmailVerification();
        });
      });
    })
    .then(() => {
      // Success - Redirect to login page
      window.location.href = 'login.html';
    })
    .catch((error) => {
      // Error
      btn.textContent = "Register Account";
      btn.disabled = false;
      errDiv.textContent = error.message;
      errDiv.style.display = 'block';
    });
  });
</script>
</body>
</html>
